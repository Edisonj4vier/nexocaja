version: 2
updates:
  # Escanea las dependencias del backend (NestJS, Prisma, etc.)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly" # Revisa vulnerabilidades cada semana
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "backend"

  # Escanea las dependencias del frontend (React, Vite, Tailwind, etc.)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "frontend"
