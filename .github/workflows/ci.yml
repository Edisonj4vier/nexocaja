name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    
    # Levanta una base de datos PostgreSQL de prueba temporalmente para los tests E2E
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: nexocaja_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install

      - name: Run Backend Linter
        working-directory: ./backend
        continue-on-error: true
        run: pnpm run lint

      - name: Setup Database (Migrate & Seed)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://admin:adminpassword@localhost:5432/nexocaja_test_db?schema=public"
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: pnpm run test

      - name: Run Backend E2E Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://admin:adminpassword@localhost:5432/nexocaja_test_db?schema=public"
          JWT_SECRET: "this-is-a-very-long-test-secret-key-for-ci-tests-32-chars"
          JWT_EXPIRES_IN: "1d"
        run: pnpm run test:e2e


  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Run Frontend Linter
        working-directory: ./frontend
        continue-on-error: true
        run: pnpm run lint

      - name: Test Frontend Build
        working-directory: ./frontend
        run: pnpm run build
