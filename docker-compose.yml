services:
  postgres:
    image: postgres:17
    container_name: nexocaja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexocaja
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexocaja-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexocaja-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexocaja
      JWT_SECRET: nexocaja_production_secret_key_2026
      JWT_EXPIRES_IN: 24h
      SWAGGER_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexocaja-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexocaja-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexocaja-network

volumes:
  postgres_data:

networks:
  nexocaja-network:
    driver: bridge
